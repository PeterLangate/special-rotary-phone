<figure class="cell sev-info" tabindex="0" role="button" data-kind="digest" data-title="12,788 · Your security digest — 18 Jun 2026"><figcaption><span class="pill">INFO</span><code>digest</code></figcaption><div class="title">12,788 · Your security digest — 18 Jun 2026</div><div class="frame"><iframe loading="lazy" src="digest.html"></iframe></div></figure></div><dialog id="viewer" aria-labelledby="viewer-title"><div class="dhdr"><span class="pill" data-role="pill"></span><span class="dttl" id="viewer-title"></span><code data-role="kind"></code><a href="" target="_blank" rel="noopener" data-role="html-open">Open in new tab</a><a href="" target="_blank" rel="noopener" data-role="text-open">Text variant</a><button type="button" class="dx" data-role="close" aria-label="Close">×</button></div><iframe title="Sentinel email preview"></iframe></dialog><script>(function(){var d=document.getElementById('viewer');var frame=d.querySelector('iframe');var ttl=d.querySelector('.dttl');var code=d.querySelector('[data-role="kind"]');var pill=d.querySelector('[data-role="pill"]');var htmlA=d.querySelector('[data-role="html-open"]');var textA=d.querySelector('[data-role="text-open"]');var closeBtn=d.querySelector('[data-role="close"]');function sevOf(cell){var m=(cell.className||'').match(/sev-([a-z]+)/);return m?m[1]:'';}function openCell(cell){var k=cell.getAttribute('data-kind');var t=cell.getAttribute('data-title');ttl.textContent=t;code.textContent=k;var s=sevOf(cell);pill.textContent=s.toUpperCase();pill.className='pill sev-'+s+'-pill';pill.style.background=(s==='critical'?'#B33F3E':s==='high'?'#d98324':s==='medium'?'#0b6e5c':'#3a6b82');frame.src=k+'.html';htmlA.href=k+'.html';textA.href=k+'.txt';d.showModal();}function closeIt(){d.close();frame.src='about:blank';}document.querySelectorAll('.cell').forEach(function(cell){cell.addEventListener('click',function(){openCell(cell);});cell.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openCell(cell);}});});closeBtn.addEventListener('click',closeIt);d.addEventListener('click',function(e){if(e.target===d){closeIt();}});d.addEventListener('close',function(){frame.src='about:blank';});})();</script></body></html>
